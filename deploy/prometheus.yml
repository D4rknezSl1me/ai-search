global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules (Phase 4). Alertmanager routing is deferred; rules still
# evaluate and surface as PENDING/FIRING on the Prometheus /alerts page.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # App services expose /metrics (Phase 1+). Harmless if down in Phase 0.
  - job_name: crawler
    static_configs:
      - targets: ["crawler:8090"]

  - job_name: ai-api
    static_configs:
      - targets: ["ai-api:8000"]

  # Playwright render worker (Phase 3) — browserworker_* render metrics.
  - job_name: browser-worker
    static_configs:
      - targets: ["browser-worker:8091"]
