<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ai-search — find everything</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0b0e14; --panel: #131824; --panel2: #1a2130; --line: #232c3d;
    --text: #e6ebf5; --muted: #8a95a8; --accent: #5eead4; --accent2: #7c9cff;
    --warn: #f0b45e; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 55%);
    color: var(--text); font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 20px 80px; }
  header { text-align: center; margin-bottom: 28px; }
  .logo { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .tag { color: var(--muted); margin-top: 4px; font-size: 14px; }
  form { display: flex; gap: 10px; margin: 22px 0 8px; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 15px 18px; border-radius: var(--radius); font-size: 16px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px #7c9cff22; }
  button {
    background: linear-gradient(180deg, var(--accent2), #5b7cf0); color: #0b0e14; border: 0;
    padding: 0 22px; border-radius: var(--radius); font-weight: 650; font-size: 15px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .opts { display: flex; gap: 16px; color: var(--muted); font-size: 13px; align-items: center; flex-wrap: wrap; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .hidden { display: none !important; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin-top: 22px; }
  .answer { font-size: 16.5px; white-space: pre-wrap; }
  .answer .cite {
    color: var(--accent); cursor: pointer; font-weight: 650; font-size: 12px; vertical-align: super;
    text-decoration: none; padding: 0 1px;
  }
  .answer .cite:hover { text-decoration: underline; }
  .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .badge { font-size: 12px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
  .badge.warn { color: var(--warn); border-color: #4a3c1e; }
  .badge b { color: var(--text); font-weight: 600; }
  h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 30px 0 6px; }
  .src { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 10px; scroll-margin-top: 16px; }
  .src.flash { border-color: var(--accent); box-shadow: 0 0 0 3px #5eead422; }
  .src .n { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--accent); margin-right: 8px; }
  .src a.title { color: var(--text); font-weight: 600; text-decoration: none; }
  .src a.title:hover { color: var(--accent2); }
  .src .url { color: var(--muted); font-size: 12px; margin: 2px 0 8px; word-break: break-all; }
  .src .snip { color: #c4ccdb; font-size: 13.5px; }
  .status { color: var(--muted); font-size: 14px; margin-top: 22px; min-height: 20px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .tab { background: var(--panel); color: var(--muted); border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab.active { color: #0b0e14; background: linear-gradient(180deg, var(--accent), #43c9b4); border-color: transparent; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 8px; }
  .grid label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .grid input, .grid select { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 11px 12px; border-radius: 10px; font-size: 14px; outline: none; }
  .grid input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px #7c9cff22; }
  .cand.best { border-color: var(--accent); box-shadow: 0 0 0 3px #5eead422; }
  .cand .hand { color: var(--accent2); font-weight: 600; }
  .badge.sig { color: var(--accent); border-color: #2d4b45; }
  .link { cursor: pointer; user-select: none; }
  .link:hover { color: var(--text); }
  .apikey { text-align: center; margin-top: 40px; }
  .apikey label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; }
  .apikey input { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 13px; width: 280px; outline: none; }
  .apikey input:focus { border-color: var(--accent2); }
  .history { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
  .history .h { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 5px 11px; border-radius: 999px; font-size: 12.5px; cursor: pointer; }
  .history .h:hover { color: var(--text); border-color: var(--accent2); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 0; }
  .filters label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .filters input { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 13.5px; outline: none; }
  .filters input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px #7c9cff22; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 50px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">ai<span>·</span>search</div>
    <div class="tag">Find every piece of information — cited, from your own crawled corpus.</div>
  </header>

  <div class="tabs">
    <button type="button" class="tab active" id="tabSearch">Search</button>
    <button type="button" class="tab" id="tabFind">Find a person</button>
  </div>

  <form id="f">
    <input id="q" type="text" placeholder="Ask anything…" autocomplete="off" autofocus />
    <button id="go" type="submit">Search</button>
  </form>
  <div class="opts" id="searchOpts">
    <label><input type="checkbox" id="synth" checked /> Synthesize answer</label>
    <label>Freshness
      <select id="fresh" style="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:3px 6px;">
        <option value="auto">auto</option><option value="fresh">fresh</option><option value="any">any</option>
      </select>
    </label>
    <span class="link" id="filtersToggle">⚙ Filters</span>
  </div>
  <div id="filters" class="filters hidden">
    <label>From date (YYYY-MM-DD) <input id="fFrom" type="text" placeholder="2024-01-01" autocomplete="off" /></label>
    <label>To date (YYYY-MM-DD) <input id="fTo" type="text" placeholder="2025-12-31" autocomplete="off" /></label>
    <label>Domains (comma-separated) <input id="fDomains" type="text" placeholder="example.com, blog.org" autocomplete="off" /></label>
    <label>Languages (comma-separated) <input id="fLangs" type="text" placeholder="en, it" autocomplete="off" /></label>
  </div>
  <div id="history" class="history"></div>

  <div id="discoverPanel" class="hidden">
    <div class="grid">
      <label>Surname <input id="dSurname" type="text" placeholder="Rossi" autocomplete="off" /></label>
      <label>Given name (leave blank if unknown) <input id="dGiven" type="text" placeholder="the thing to find" autocomplete="off" /></label>
      <label>Goal
        <select id="dGoal">
          <option value="any_info">any info</option>
          <option value="social_handle">social handle</option>
          <option value="real_name">real name</option>
          <option value="contact">contact</option>
          <option value="photos">photos</option>
        </select>
      </label>
      <label>City <input id="dCity" type="text" placeholder="Como" autocomplete="off" /></label>
      <label>School <input id="dSchool" type="text" placeholder="Liceo Volta" autocomplete="off" /></label>
      <label>Employer <input id="dEmployer" type="text" placeholder="Acme Corp" autocomplete="off" /></label>
      <label>Related person (mutual friend / sibling…) <input id="dRelName" type="text" placeholder="Marco Rossi" autocomplete="off" /></label>
      <label>Relation
        <select id="dRelType">
          <option value="sibling_of">sibling of</option>
          <option value="friend_of">friend of</option>
          <option value="parent_of">parent of</option>
          <option value="child_of">child of</option>
          <option value="works_with">works with</option>
        </select>
      </label>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="dLive" checked /> Live web discovery (SearXNG)</label>
      <button id="findGo" type="button">Find</button>
    </div>
  </div>

  <div id="status" class="status"></div>
  <div id="answerCard" class="card hidden">
    <div id="answer" class="answer"></div>
    <div id="meta" class="meta"></div>
  </div>
  <div id="sources"></div>
  <div id="coveragePanel" class="card hidden"></div>

  <div class="apikey">
    <label>API key <input id="apiKey" type="password" placeholder="only if the server requires auth" autocomplete="off" /></label>
  </div>
  <footer>Fully self-hosted · local LLM · no paid APIs · <span class="link" id="covToggle">coverage</span></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const form = $('#f'), input = $('#q'), go = $('#go');
const statusEl = $('#status'), answerCard = $('#answerCard'), answerEl = $('#answer'),
      metaEl = $('#meta'), sourcesEl = $('#sources');

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// ---- API key (optional; only needed when the server has AUTH_ENABLED) ------
const AKEY = 'aisearch_apikey';
const apiKeyEl = $('#apiKey');
apiKeyEl.value = localStorage.getItem(AKEY) || '';
apiKeyEl.addEventListener('change', () => localStorage.setItem(AKEY, apiKeyEl.value.trim()));
function authHeaders(){
  const h = { 'Content-Type': 'application/json' };
  const k = (localStorage.getItem(AKEY) || '').trim();
  if(k) h['X-API-Key'] = k;
  return h;
}

// Render answer text, turning [n] into clickable citation chips.
function renderAnswer(text){
  answerEl.innerHTML = esc(text).replace(/\[(\d+)\]/g,
    (m,n) => `<a class="cite" href="#src-${n}" onclick="flashSrc(${n})">[${n}]</a>`);
}
function flashSrc(n){
  const el = document.getElementById('src-'+n);
  if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 1200); }
}

function addSource(s){
  const div = document.createElement('div');
  div.className = 'src'; div.id = 'src-' + s.n;
  const score = (s.score!=null) ? `<span class="badge">score ${s.score}</span>` : '';
  div.innerHTML = `<span class="n">${s.n}</span>`
    + `<a class="title" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`
    + `<div class="url">${esc(s.domain||'')} — ${esc(s.url)}</div>`
    + `<div class="snip">${esc(s.snippet||'')}</div>`;
  sourcesEl.appendChild(div);
}

function renderMeta(m){
  const bits = [];
  if(m.mode) bits.push(`<span class="badge"><b>${m.mode}</b> mode</span>`);
  if(m.confidence!=null) bits.push(`<span class="badge">confidence <b>${m.confidence}</b></span>`);
  if(m.coverage) bits.push(`<span class="badge">${m.coverage.used}/${m.coverage.candidates} chunks · ${m.coverage.domains} domains</span>`);
  if(m.reason) bits.push(`<span class="badge warn">${esc(m.reason)}</span>`);
  const d = m.degraded||{};
  Object.keys(d).filter(k=>d[k]).forEach(k => bits.push(`<span class="badge warn">${k} unavailable</span>`));
  metaEl.innerHTML = bits.join('');
}

async function search(query){
  go.disabled = true;
  answerCard.classList.add('hidden'); answerEl.innerHTML=''; metaEl.innerHTML='';
  sourcesEl.innerHTML=''; document.querySelectorAll('h2.sec').forEach(e=>e.remove());
  statusEl.innerHTML = '<span class="dot"></span>Searching…';
  let answer = '', srcHeaderAdded = false, gotToken = false;

  pushHistory(query);
  const body = { query, filters: collectFilters(), options: { stream:true, synthesize: $('#synth').checked, freshness: $('#fresh').value, max_sources: 8 } };
  let resp;
  try {
    resp = await fetch('/v1/search', { method:'POST', headers: authHeaders(), body: JSON.stringify(body) });
  } catch(e){ statusEl.textContent = 'Request failed: ' + e; go.disabled=false; return; }
  if(resp.status === 401 || resp.status === 429){
    statusEl.textContent = resp.status === 401 ? 'API key required or invalid (set it below).' : 'Rate limit exceeded — try again shortly.';
    go.disabled = false; return;
  }

  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  const ensureSrcHeader = () => { if(!srcHeaderAdded){ const h=document.createElement('h2'); h.className='sec'; h.textContent='Sources'; sourcesEl.before(h); srcHeaderAdded=true; } };

  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n\n')) >= 0){
      const raw = buf.slice(0,i); buf = buf.slice(i+2);
      let ev='message', data='';
      for(const line of raw.split('\n')){
        if(line.startsWith('event:')) ev = line.slice(6).trim();
        else if(line.startsWith('data:')) data += line.slice(5).trim();
      }
      let payload; try { payload = JSON.parse(data); } catch { continue; }
      if(ev==='source'){ ensureSrcHeader(); addSource(payload); }
      else if(ev==='token'){ gotToken=true; answerCard.classList.remove('hidden'); answer += payload.t; renderAnswer(answer); statusEl.innerHTML='<span class="dot"></span>Generating answer…'; }
      else if(ev==='citations'){ /* sources already shown; citations reconcile */ }
      else if(ev==='meta'){ answerCard.classList.remove('hidden'); if(!gotToken && payload.mode==='retrieve'){ answerEl.innerHTML='<span style="color:var(--muted)">Retrieve-only — synthesis disabled or LLM unavailable. See sources below.</span>'; } renderMeta(payload); }
      else if(ev==='error'){ statusEl.textContent = 'Error: ' + (payload.detail||'synthesis failed'); }
    }
  }
  statusEl.textContent = '';
  go.disabled = false;
}

form.addEventListener('submit', e => { e.preventDefault(); const q = input.value.trim(); if(q) search(q); });

// ---- mode tabs: Search ⇄ Find a person -----------------------------------
const tabSearch = $('#tabSearch'), tabFind = $('#tabFind');
const searchOpts = $('#searchOpts'), discoverPanel = $('#discoverPanel');
function clearOutput(){
  answerCard.classList.add('hidden'); answerEl.innerHTML=''; metaEl.innerHTML='';
  sourcesEl.innerHTML=''; statusEl.textContent='';
  document.querySelectorAll('h2.sec').forEach(e=>e.remove());
}
function setMode(find){
  tabFind.classList.toggle('active', find); tabSearch.classList.toggle('active', !find);
  discoverPanel.classList.toggle('hidden', !find);
  form.classList.toggle('hidden', find); searchOpts.classList.toggle('hidden', find);
  // History + filters belong to Search mode only.
  $('#history').classList.toggle('hidden', find);
  $('#filters').classList.toggle('hidden', find || !filtersOpen);
  clearOutput();
  (find ? $('#dSurname') : input).focus();
}

// ---- search filters (wired to /v1/search `filters`) -----------------------
let filtersOpen = false;
$('#filtersToggle').addEventListener('click', () => {
  filtersOpen = !filtersOpen;
  $('#filters').classList.toggle('hidden', !filtersOpen);
});
function collectFilters(){
  const f = {}, g = id => $(id).value.trim();
  const csv = id => g(id).split(',').map(s => s.trim()).filter(Boolean);
  if(g('#fFrom')) f.date_from = g('#fFrom');
  if(g('#fTo')) f.date_to = g('#fTo');
  const doms = csv('#fDomains'); if(doms.length) f.domains_include = doms;
  const langs = csv('#fLangs'); if(langs.length) f.languages = langs;
  return f;
}

// ---- recent-search history (client-side, localStorage) --------------------
const HKEY = 'aisearch_history';
function getHistory(){ try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch { return []; } }
function renderHistory(){
  const el = $('#history'); el.innerHTML = '';
  getHistory().forEach(q => {
    const s = document.createElement('span'); s.className = 'h'; s.textContent = q; s.title = 'Search again';
    s.addEventListener('click', () => { input.value = q; setMode(false); search(q); });
    el.appendChild(s);
  });
}
function pushHistory(q){
  let h = getHistory().filter(x => x !== q); h.unshift(q); h = h.slice(0, 8);
  localStorage.setItem(HKEY, JSON.stringify(h)); renderHistory();
}
renderHistory();

// ---- coverage panel: what's indexed (GET /v1/coverage) --------------------
$('#covToggle').addEventListener('click', toggleCoverage);
async function toggleCoverage(){
  const p = $('#coveragePanel');
  if(!p.classList.contains('hidden')){ p.classList.add('hidden'); return; }
  p.classList.remove('hidden');
  p.innerHTML = '<div class="status"><span class="dot"></span>Loading coverage…</div>';
  try {
    const r = await fetch('/v1/coverage'); renderCoverage(await r.json());
  } catch(e){ p.innerHTML = '<div class="status">Coverage unavailable: ' + esc(''+e) + '</div>'; }
}
function renderCoverage(d){
  const p = $('#coveragePanel');
  if(!d || d.available === false){
    p.innerHTML = '<h2 class="sec" style="margin-top:0">Coverage</h2>'
      + '<div class="status">Datastores unavailable — bring up Postgres to see indexed coverage.</div>';
    return;
  }
  const doms = (d.by_domain||[]).slice(0,12)
    .map(x => `<span class="badge">${esc(x.domain||'—')} <b>${x.documents}</b></span>`).join(' ');
  p.innerHTML = '<h2 class="sec" style="margin-top:0">Coverage</h2>'
    + `<div class="meta"><span class="badge">documents <b>${d.documents}</b></span>`
    + `<span class="badge">indexed <b>${d.documents_indexed}</b></span>`
    + `<span class="badge">chunks <b>${d.chunks}</b></span></div>`
    + (doms ? `<h2 class="sec">Top domains</h2><div class="meta">${doms}</div>` : '');
}
tabSearch.addEventListener('click', () => setMode(false));
tabFind.addEventListener('click', () => setMode(true));

// ---- targeted person lookup → POST /v1/discover/entity --------------------
function chip(t, cls){ return `<span class="badge ${cls||''}">${esc(t)}</span>`; }

$('#findGo').addEventListener('click', runDiscover);
discoverPanel.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); runDiscover(); } });

async function runDiscover(){
  const surname = $('#dSurname').value.trim(), given = $('#dGiven').value.trim();
  if(!surname && !given){ statusEl.textContent = 'Enter at least a surname.'; return; }
  const attrs = {}; const add = (id,k) => { const v = $(id).value.trim(); if(v) attrs[k]=v; };
  add('#dCity','city'); add('#dSchool','school'); add('#dEmployer','employer');
  const rels = []; const rn = $('#dRelName').value.trim();
  if(rn) rels.push({ type: $('#dRelType').value, of: rn });
  const brief = {
    goal: $('#dGoal').value,
    subject: { surname, given_name: given || null, known_attributes: attrs, relationships: rels },
    constraints: { platforms: ['open_web'], budget: { max_hops: 4, max_fetches: 200, max_wall_s: 900 } },
    discover: $('#dLive').checked,
  };
  const btn = $('#findGo'); btn.disabled = true; clearOutput();
  statusEl.innerHTML = '<span class="dot"></span>Searching corpus &amp; live web…';
  let data;
  try {
    const r = await fetch('/v1/discover/entity', { method:'POST', headers: authHeaders(), body: JSON.stringify(brief) });
    if(r.status === 401 || r.status === 429){
      statusEl.textContent = r.status === 401 ? 'API key required or invalid (set it below).' : 'Rate limit exceeded — try again shortly.';
      btn.disabled = false; return;
    }
    data = await r.json();
  } catch(e){ statusEl.textContent = 'Request failed: ' + e; btn.disabled=false; return; }
  btn.disabled = false;
  renderDiscovery(data);
}

function renderDiscovery(d){
  statusEl.textContent = '';
  if(d && d.error){ statusEl.textContent = 'Error: ' + d.error; return; }
  const st = (d && d.status) || 'no_match', stats = (d && d.stats) || {};
  const h = document.createElement('h2'); h.className = 'sec'; h.textContent = 'Result — ' + st; sourcesEl.before(h);
  const head = document.createElement('div'); head.className = 'meta';
  head.innerHTML = chip('status: ' + st, st==='resolved' ? '' : 'warn')
    + chip((stats.hops||0) + ' hops') + chip((stats.fetches||0) + ' fetches')
    + (stats.elapsed_s!=null ? chip(stats.elapsed_s + 's') : '');
  sourcesEl.appendChild(head);

  const cands = (d && d.candidates) || [];
  if(!cands.length){
    const p = document.createElement('div'); p.className = 'status';
    p.textContent = 'No candidates found within budget.'; sourcesEl.appendChild(p); return;
  }
  const bestUrl = d.best ? d.best.source_url : null;
  cands.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'src cand' + (bestUrl && c.source_url===bestUrl ? ' best' : '');
    const sigs = Object.entries(c.signals||{}).map(([k,v]) => chip(k + ' ' + v, 'sig')).join('');
    const attrs = Object.entries(c.attributes||{}).map(([k,v]) => chip(k + ': ' + v)).join('');
    const co = (c.co_mentions||[]).length ? `<div class="url">seen with: ${esc(c.co_mentions.join(', '))}</div>` : '';
    div.innerHTML = `<span class="n">${i+1}</span>`
      + `<a class="title" href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(c.name || c.handle || c.source_url)}</a>`
      + (c.handle ? ` <span class="hand">${esc(c.handle)}</span>` : '')
      + ` <span class="badge">score ${c.score}</span>`
      + `<div class="url">${esc(c.source_url)}</div>`
      + co
      + ((sigs||attrs) ? `<div class="meta">${sigs}${attrs}</div>` : '');
    sourcesEl.appendChild(div);
  });
}
</script>
</body>
</html>
